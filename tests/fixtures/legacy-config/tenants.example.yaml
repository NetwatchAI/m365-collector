# Copy to tenants.yaml, or use `m365c tenant add`. Hot reloaded.
tenants:
  - id: 11111111-1111-1111-1111-111111111111   # client tenant ID (fake)
    name: contoso.onmicrosoft.com              # used as the `tenant` label
    customer: contoso                          # used as the `customer` label / thresholds key
    collectors: all                            # or a list, e.g. [license, users]
    enabled: true
  - id: 22222222-2222-2222-2222-222222222222
    name: fabrikam.onmicrosoft.com
    customer: fabrikam
    collectors: [license, users, servicehealth]
    enabled: true
