[project]
name = "m365c"
version = "0.1.0"
description = "Multi-tenant Microsoft 365 collector exposing Prometheus metrics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "azure-identity>=1.17",
    "aiohttp>=3.9",          # transport used by azure-identity aio credentials
    "cryptography>=42",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
vault = ["hvac>=2.1"]
azure = ["azure-keyvault-secrets>=4.8"]

[project.scripts]
m365c = "m365c.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001"]  # ✅/❌ are intentional in CLI output

[tool.ruff.lint.per-file-ignores]
"src/m365c/cli.py" = ["B008"]  # typer defaults are calls by design
"tests/**" = ["E501"]  # inline YAML/JSON fixture data

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/m365c"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hvac", "hvac.*", "azure.keyvault.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
