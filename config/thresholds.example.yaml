# Copy to thresholds.yaml. Hot reloaded. Exposed as m365_threshold{check=...}
# per tenant; the Prometheus alert rules and dashboards join against it.
# Zabbix template macro in brackets.
defaults:
  license_util_warn: 0.95     # consumed / total
  storage_used_warn: 0.90     # mailbox and OneDrive used / quota
  inactive_days: 30           # licensed user without sign-in / mailbox without activity [{$MS.GRAPH.DAYS.INACTIVE}]
  mail_sent_max: 800          # over the report period [{$MAILS.SENT}] (old key: mail_sent_max_7d)
  mail_received_max: 800      # [{$MAILS.RECEIVED}] (old key: mail_received_max_7d)
  mailbox_size_gb_min: 10     # dashboard filter [{$MS.GRAPH.MAILBOX.SIZE.GB}]
  onedrive_size_gb_min: 1     # dashboard filter [{$MS.GRAPH.ONEDRIVE.SIZE.GB}]
customers:
  contoso:
    storage_used_warn: 0.85
