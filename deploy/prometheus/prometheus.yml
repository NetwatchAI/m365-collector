global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: m365c
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ["collector:9365"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
